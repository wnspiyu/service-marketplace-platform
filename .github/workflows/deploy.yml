name: Build and Deploy to AWS EC2

on:
  workflow_dispatch:

env:
  IMAGE_REPO: nipuniit/service-market-place

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-17-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JAR
        run: cd backend && mvn clean install -DskipTests -B

      - name: Rename JAR for Docker
        run: cp backend/target/*.jar backend/app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/app.jar
          retention-days: 1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    container: node:18-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          REACT_APP_API_URL: http://${{ secrets.EC2_HOST }}:8080/api
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  docker-push-backend:
    name: Push Backend Image
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_REPO }}:backend-latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  docker-push-frontend:
    name: Push Frontend Image
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_REPO }}:frontend-latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-push-backend, docker-push-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.demo.yml,database/init.sql,database/schema.sql,database/seed-data.sql"
          target:   "~/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD:    ${{ secrets.DB_PASSWORD }}
          JWT_SECRET:     ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME:  ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD:  ${{ secrets.MAIL_PASSWORD }}
          APP_BASE_URL:   http://${{ secrets.EC2_HOST }}:3000
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     DB_PASSWORD,JWT_SECRET,MAIL_USERNAME,MAIL_PASSWORD,APP_BASE_URL,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd ~/app

            # Write .env from GitHub secrets
            printf 'DB_PASSWORD=%s\n'   "$DB_PASSWORD"   >  .env
            printf 'JWT_SECRET=%s\n'    "$JWT_SECRET"    >> .env
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME" >> .env
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD" >> .env
            printf 'APP_BASE_URL=%s\n'  "$APP_BASE_URL"  >> .env

            # Log in to Docker Hub to pull private images
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker compose -f docker-compose.demo.yml pull
            docker compose -f docker-compose.demo.yml up -d --remove-orphans
            docker image prune -f
